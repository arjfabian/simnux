    TO DO: 
    1. Change admin password.
    2. Close port 8080.
  "/var/log/auth.log": "Apr  2 11:30:01 simnux sshd[123]: Accepted password for user..."
  "/bin/sh": "__BINARY_PLACEHOLDER__"
