[project]
name = "simnux"
version = "0.4.0"
description = "Browser-based Linux shell simulator for cybersecurity training and systems simulation."
authors = [
    { name = "José Fabián", email = "jfabian@datorum.net" }
]

dependencies = [
    "fastapi",
    "uvicorn",
    "pydantic",
]

requires-python = ">=3.10"

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "httpx",
    "ruff",
    "mypy",
]

[project.scripts]
simnux = "simnux.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "N",
    "UP",
    "B",
    "C4",
    "SIM",
    "PTH",
]
ignore = [
    "E501",
]

[tool.ruff.lint.isort]
case-sensitive = true
force-single-line = true
force-sort-within-sections = true
lines-after-imports = 2
known-first-party = ["simnux"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
