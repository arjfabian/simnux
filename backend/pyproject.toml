[project]
name = "simnux"
dynamic = ["version"]

description = "Browser-based Linux shell simulator for cybersecurity training and systems simulation."
authors = [
    { name = "José Fabián", email = "jfabian@datorum.net" }
]

dependencies = [
    "fastapi",
    "uvicorn",
    "pydantic",
    "slowapi>=0.1.9",
]

requires-python = ">=3.10"

[project.optional-dependencies]
dev = [
    "pytest>=9.1",
    "pytest-asyncio>=1.2",
    "pytest-cov>=7.0",
    "httpx>=0.28",
    "ruff>=0.15",
    "mypy>=1.18",
]

[project.scripts]
simnux = "simnux.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.dynamic]
version = { attr = "simnux.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "N",
    "UP",
    "B",
    "C4",
    "SIM",
    "PTH",
]
ignore = [
    "E501",
]

[tool.ruff.lint.isort]
case-sensitive = true
force-single-line = true
force-sort-within-sections = true
lines-after-imports = 2
known-first-party = ["simnux"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint.per-file-ignores]
"tests/conftest.py" = ["E402"]